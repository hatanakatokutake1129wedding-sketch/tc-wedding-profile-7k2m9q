<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F1E8">
<title>Tasuku &amp; Chisato wedding party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header" id="top-header">
  <a class="site-title" href="#top" id="site-title"></a>
  <button class="menu-btn" id="menu-btn" aria-label="メニューを開く" aria-expanded="false" aria-controls="menu">
    <span></span><span></span><span></span>
  </button>
</header>

<nav class="menu" id="menu" aria-hidden="true">
  <ul>
    <li><a href="#top">Top<small>トップ</small></a></li>
    <li><a href="#profile">Profile<small>ふたりの紹介</small></a></li>
    <li><a href="#favorites">Favorites<small>好きなもの</small></a></li>
    <li><a href="#playlist">Playlist<small>プレイリスト</small></a></li>
    <li><a href="#qa">Q&amp;A<small>ゲストからの質問</small></a></li>
  </ul>
</nav>

<main class="page" id="top">

  <section class="hero" id="hero">
    <div class="hero-photo ph" id="hero-photo"></div>
    <h1 class="hero-names reveal"><span>Tasuku</span><i>&amp;</i><span>Chisato</span></h1>
    <p class="hero-meta reveal" id="hero-meta"></p>
    <a class="scroll-hint" href="#profile" aria-label="下へ"><span>スクロール</span></a>
  </section>

  <section class="sec" id="profile">
    <h2 class="sec-title reveal"><small>01</small>Profile<em>ふたりの紹介</em></h2>
    <div id="profile-body"></div>
  </section>

  <section class="sec" id="favorites">
    <h2 class="sec-title reveal"><small>02</small>Favorites<em>好きなもの</em></h2>
    <p class="sec-lead reveal">ふたりの「好き」をいくつか紹介します</p>
    <div class="stack" id="stack"></div>
  </section>

  <section class="sec" id="playlist">
    <h2 class="sec-title reveal"><small>03</small>Playlist<em>プレイリスト</em></h2>
    <p class="sec-lead reveal" id="playlist-caption"></p>
    <div class="playlist reveal" id="playlist-body"></div>
  </section>

  <section class="sec" id="qa">
    <h2 class="sec-title reveal"><small>04</small>Q&amp;A<em>ゲストからの質問</em></h2>
    <p class="sec-lead reveal">みなさんからいただいた質問に答えました</p>
    <div class="qa" id="qa-body"></div>
  </section>

  <footer class="footer">
    <div class="footer-photo ph reveal" id="footer-photo"></div>
    <p class="footer-thanks reveal" id="footer-thanks"></p>
    <p class="footer-sign reveal">Tasuku <i>&amp;</i> Chisato</p>
    <a class="to-top" href="#top">&lsaquo;&ensp;TOP</a>
  </footer>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-back" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="Message">
    <p class="modal-label" id="modal-label">Message</p>
    <div class="modal-body" id="modal-body"></div>
    <button class="modal-close" data-close>Close</button>
  </div>
</div>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
